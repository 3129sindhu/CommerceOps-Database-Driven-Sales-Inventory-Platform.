<!doctype html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Add Product</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

    <link rel="stylesheet" href="style1.css">

</head>

<body>

<img class="bg" src="img2.jpg" alt="Grocery shopping">

<div class="container my-4">

    <h1 class="text-center">Enter Product Details</h1>

    <form action="../BE/PRODUCTS/addProduct.php" method="POST">

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="product_name" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select class="form-control" name="category" required>
                <option value="Fruits">Fruits</option>
                <option value="Vegetables">Vegetables</option>
                <option value="BakeryProducts">Bakery Products</option>
                <option value="MasalaAndSpices">Masala and Spices</option>
                <option value="CleaningAndHousehold">Cleaning and Household</option>
                <option value="Beverages">Beverages</option>
                <option value="Cosmetics">Cosmetics</option>
                <option value="Toys">Toys</option>
                <option value="Stationary">Stationary</option>
                <option value="Medicines">Medicines</option>
            </select>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea class="form-control" name="description" required></textarea>
        </div>

        <div class="form-group">
            <label>Price</label>
            <input type="number" name="price" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Stock</label>
            <input type="number" name="stock" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <button type="reset" class="btn btn-secondary">Reset</button>

    </form>

</div>

</body>
</html>
