<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css"
          integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk"
          crossorigin="anonymous">

    <link rel="stylesheet" href="./style1.css">
</head>

<body>

<div class="bg-image1">
    <br>
    <h1 class="text-center">Welcome to E-Shopping!</h1>
    <br>
    <p class="text-center">Please Register here to place your order</p>

    <form action="../BE/CUSTOMERS/signUp.php" method="post">
        <div class="white-container">

            <div class="form-group">
                <label for="cust_name">Name</label>
                <input type="text" class="form-control" id="cust_name" name="cust_name" required>
            </div>

            <fieldset class="form-group">
                <label>Gender</label><br>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label><br>

                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label><br>

                <input type="radio" id="other" name="gender" value="other" required>
                <label for="other">Other</label>
            </fieldset>

            <div class="form-group">
                <label for="birthday">DOB</label>
                <input type="date" class="form-control" id="birthday" name="birthday" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea class="form-control" id="address" name="address"></textarea>
            </div>

            <div class="form-group">
                <label for="contact">Contact</label>
                <input type="text" class="form-control" id="contact" name="contact" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="cpassword">Confirm Password</label>
                <input type="password" class="form-control" id="cpassword" name="cpassword" required>
                <small class="form-text text-muted">
                    Make sure to type the same password
                </small>
            </div>

            <button type="submit" class="btn btn-primary">Sign Up</button>

            <a href="http://localhost/DBMS_PRO/PROJECT/FE/loginPage.html"
               class="btn btn-primary">Login</a>

            <button type="reset" class="btn btn-primary">Reset</button>

        </div>
    </form>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"

<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"

        crossorigin="anonymous"></script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"
        integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI"
        crossorigin="anonymous"></script>

</body>
</html>
